spring.application.name=online-tiffin-service

#DB configuration
spring.datasource.url= jdbc:mysql://${JDBC_HOST}:${JDBC_PORT}/${JDBC_DB}?ssl-mode=REQUIRED
spring.datasource.username= ${JDBC_USERNAME}
spring.datasource.password= ${JDBC_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

#Sending Email configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#Cloudinary configurations
config.cloudinary.cloud.name=${CLOUDINARY_NAME}
config.cloudinary.cloud.key= ${CLOUDINARY_KEY}
config.cloudinary.cloud.secret=${CLOUDINARY_SECRET}